apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 871773732682.dkr.ecr.us-east-1.amazonaws.com/cloud-native-saas-dev-backend:latest
          ports:
            - containerPort: 8000