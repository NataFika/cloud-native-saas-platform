apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 871773732682.dkr.ecr.us-east-1.amazonaws.com/cloud-native-saas-dev-frontend:latest
          ports:
            - containerPort: 80